<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Fofi</title>
  <style>
    :root { --pink: #ff4fd8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #app { position: fixed; inset: 0; background: #000; }
    canvas, #three { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #tulip-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at bottom, #12061a 0%, #05030a 60%); transition: opacity 1.2s ease; z-index: 2; }
    #tulip-stage.fade { opacity: 0; pointer-events: none; }
    #heart-stage { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; background:#000; z-index: 1; }
    #heart-stage.show { opacity: 1; pointer-events: auto; }
    #hint {
      position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      font-size: 13px; color: rgba(255,255,255,.8); text-align: center;
      padding: 8px 14px; border-radius: 999px; background: rgba(20,10,28,.45); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,105,180,.3); opacity: 0; transition: opacity .8s ease; pointer-events: none; z-index: 5;
    }
    #hint.show { opacity: 1; }
    #repeat {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; z-index: 5;
      padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,105,180,.5);
      background: rgba(20,10,28,.55); color: #ffd9f0; font-size: 13px; font-weight: 600;
      backdrop-filter: blur(6px); opacity: 0; transform: translateY(-6px);
      transition: opacity .6s ease, transform .6s ease; pointer-events: none;
    }
    #repeat.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .stars { position:absolute; inset:0; pointer-events:none; background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.25), transparent);
      opacity:.5; z-index:3; }
  </style>
</head>
<body>
  <div id="app">
    <div class="stars"></div>
    <div id="tulip-stage"><canvas id="tulip"></canvas></div>
    <div id="heart-stage"><div id="three"></div></div>
    <button id="repeat" aria-label="Repetir">↺ Repetir</button>
    <div id="hint">Girá y hacé zoom</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const PHRASES = ["Te amo","I love you","Je t’aime","Ti amo","Eu te amo","Ich liebe dich","Ik hou van je","Jag älskar dig","Jeg elsker deg","Jeg elsker dig","Rakastan sinua","Ég elska þig","Kocham cię","Miluji tě","Ľúbim ťa","Szeretlek","Te iubesc","T’estimo","Quérote","Maite zaitut","Σ’ αγαπώ","Я тебя люблю","Я тебе кохаю","Обичам те","Волим те","Volim te","Ljubim te","Те сакам","Të dua","Myliu tave","Es tevi mīlu","Ma armastan sind","Seni seviyorum","أحبك","אני אוהב אותך","دوستت دارم","मैं तुमसे प्यार करता हूँ","আমি তোমাকে ভালোবাসি","میں تم سے محبت کرتا ہوں","ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","நான் உன்னை காதலிக்கிறேன்","నేను నిన్ను ప్రేమిస్తున్నాను","मी तुझ्यावर प्रेम करतो","હું તને પ્રેમ કરું છું","ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","我爱你","愛してる","사랑해","ฉันรักคุณ","Anh yêu em","Aku cinta kamu","Saya cintakan awak","Mahal kita","Aku tresna sampeyan","Nakupenda","Ngiyakuthanda","Ndiyakuthanda","Ek het jou lief","እወድሃለሁ","Ina son ki","Mo nifẹ rẹ","A hụrụ m gị n’anya","Waan ku jeclahay","Tiako ianao","Inħobbok","Tá grá agam duit","Tha gaol agam ort","Rwy’n dy garu di","Da garout a ran","Te amo","Mi amas vin","მიყვარხარ","Ես քեզ սիրում եմ","Mən səni sevirəm","Мен сені жақсы көремін","Men seni sevaman","Ман туро дӯст медорам","Мен сени сүйөм","Men seni söýýärin","Би чамд хайртай","म तिमीलाई माया गर्छु","මම ඔයාට ආදරෙයි","မင်းကိုချစ်တယ်","ខ្ញុំស្រឡាញ់អ្នក","ຂ້ອຍຮັກເຈົ້າ","زه تا سره مینه لرم","Ez te hez dikim","איך האָב דיך ליב","Ech hunn dech gär","Ik hâld fan dy","Volim te","Aroha ahau ki a koe","Aloha au iā ʻoe","Ou te alofa ia te oe","Ua here au ia oe","Kuyayki","Munsmawa","Rohayhu","Poyeyen","Te quiero","Aš tave myliu","Ana behibek","Seni çok seviyorum","Mi te jam","Taim i' ngra leat","Is breá liom tú","Kuv hlub koj","Ya tebya liubliu","Te sakam mnogu","Mwen renmen ou","Ninakupenda","Ek is lief vir jou","Saya cinta padamu","Main tumse pyar karta hoon","Eu te iubesc","Volim te puno"];

    const tulipCanvas = document.getElementById('tulip');
    const tctx = tulipCanvas.getContext('2d');
    const tulipStage = document.getElementById('tulip-stage');
    const heartStage = document.getElementById('heart-stage');
    const hint = document.getElementById('hint');
    const repeatBtn = document.getElementById('repeat');

    let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
    let startTime=0, animId, particles=[], transitioning=false;
    let renderer, scene, camera, controls, group, heartBuilt=false, heartStart=0;

    function resizeAll(){
      W = window.innerWidth; H = window.innerHeight; dpr = Math.min(window.devicePixelRatio||1,2);
      tulipCanvas.width = Math.floor(W*dpr); tulipCanvas.height = Math.floor(H*dpr);
      tctx.setTransform(dpr,0,0,dpr,0,0);
      if(renderer){ renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix(); }
    }
    window.addEventListener('resize', resizeAll, {passive:true});

    function drawTulip(t){
      tctx.clearRect(0,0,W,H);
      const cx=W/2, baseY=H*0.78, sway=Math.sin(t*0.0012)*6;
      const scale=Math.min(W,H)/520;
      tctx.save();
      tctx.translate(cx, baseY);
      tctx.rotate(sway*Math.PI/180*0.6);
      const stemH=220*scale;
      const gradStem=tctx.createLinearGradient(0,0,0,-stemH);
      gradStem.addColorStop(0,'#1f7a4a'); gradStem.addColorStop(1,'#46d17f');
      tctx.strokeStyle=gradStem; tctx.lineWidth=10*scale; tctx.lineCap='round';
      tctx.beginPath();
      tctx.moveTo(0,0);
      tctx.quadraticCurveTo(18*scale,-stemH*0.45,-6*scale,-stemH);
      tctx.stroke();
      function leaf(side){
        tctx.save(); tctx.translate(0,-stemH*0.35); tctx.scale(side,1);
        const g=tctx.createLinearGradient(0,0,120*scale,-40*scale);
        g.addColorStop(0,'#2aa35f'); g.addColorStop(1,'#7dffb2');
        tctx.fillStyle=g; tctx.shadowColor='rgba(80,255,160,.25)'; tctx.shadowBlur=18*scale;
        tctx.beginPath();
        tctx.moveTo(0,0);
        tctx.quadraticCurveTo(70*scale,-10*scale,120*scale,-70*scale);
        tctx.quadraticCurveTo(55*scale,-20*scale,0,10*scale);
        tctx.fill(); tctx.restore();
      }
      leaf(1); leaf(-0.9);
      const py=-stemH, bloom=1+Math.sin(t*0.002)*0.03;
      tctx.translate(0,py);
      tctx.scale(bloom,bloom);
      const petal=(ang,rx,ry,rot,color1,color2)=>{
        tctx.save(); tctx.rotate(ang+rot);
        const g=tctx.createRadialGradient(0,-ry*0.2,ry*0.1,0,0,ry);
        g.addColorStop(0,color1); g.addColorStop(1,color2);
        tctx.fillStyle=g; tctx.shadowColor='rgba(255,90,150,.35)'; tctx.shadowBlur=22*scale;
        tctx.beginPath();
        tctx.moveTo(0,0);
        tctx.bezierCurveTo(rx, -ry*0.2, rx*0.9, -ry, 0, -ry*1.15);
        tctx.bezierCurveTo(-rx*0.9, -ry, -rx, -ry*0.2, 0, 0);
        tctx.fill(); tctx.restore();
      };
      const r1='#ff6fae', r2='#d81b60', r3='#ff9ecb', r4='#ff4f8b';
      petal(0,55*scale,95*scale,0,r3,r2);
      petal(-0.55,50*scale,90*scale,0,r1,r2);
      petal(0.55,50*scale,90*scale,0,r1,r2);
      petal(-0.2,42*scale,80*scale,0,r4,r2);
      petal(0.2,42*scale,80*scale,0,r4,r2);
      const glow=tctx.createRadialGradient(0,-40*scale,5*scale,0,-40*scale,60*scale);
      glow.addColorStop(0,'rgba(255,220,240,.7)'); glow.addColorStop(1,'rgba(255,120,180,0)');
      tctx.fillStyle=glow; tctx.beginPath(); tctx.arc(0,-40*scale,55*scale,0,Math.PI*2); tctx.fill();
      tctx.restore();
      const gg=tctx.createRadialGradient(cx,H*0.82,10*scale,cx,H*0.82,140*scale);
      gg.addColorStop(0,'rgba(255,79,216,.18)'); gg.addColorStop(1,'rgba(255,79,216,0)');
      tctx.fillStyle=gg; tctx.beginPath(); tctx.ellipse(cx,H*0.83,140*scale,30*scale,0,0,Math.PI*2); tctx.fill();
    }

    function spawnParticlesFromTulip(){
      const cx=W/2, cy=H*0.45;
      particles=[];
      const count = Math.min(240, Math.floor((W*H)/5200));
      for(let i=0;i<count;i++){
        const ang=Math.random()*Math.PI*2, rad=Math.random()*Math.min(W,H)*0.18;
        particles.push({
          x: cx + Math.cos(ang)*rad + (Math.random()-0.5)*40,
          y: cy + Math.sin(ang)*rad*0.9 + (Math.random()-0.5)*40,
          vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.8)*1.2,
          tx:0, ty:0, s:1+Math.random()*2.2, hue: 330 + Math.random()*20
        });
      }
      for(let i=0;i<particles.length;i++){
        const tt=i/particles.length*Math.PI*2;
        const x=16*Math.pow(Math.sin(tt),3);
        const y=13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt);
        particles[i].tx = cx + x * Math.min(W,H)*0.014;
        particles[i].ty = cy + 10 - y * Math.min(W,H)*0.014;
      }
    }

    function drawTransition(p){
      tctx.clearRect(0,0,W,H);
      for(const pt of particles){
        pt.x += (pt.tx-pt.x)*0.06 + pt.vx*0.2;
        pt.y += (pt.ty-pt.y)*0.06 + pt.vy*0.2;
        tctx.beginPath();
        tctx.fillStyle=`hsla(${pt.hue},100%,75%,${0.25 + p*0.55})`;
        tctx.shadowColor=`hsla(${pt.hue},100%,70%,.8)`; tctx.shadowBlur=8;
        tctx.arc(pt.x,pt.y,pt.s,0,Math.PI*2); tctx.fill();
      }
      tctx.shadowBlur=0;
    }

    function heartPoint2D(t){
      const x = 16 * Math.pow(Math.sin(t),3);
      const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      return {x, y};
    }

    function insideHeart2D(x,y){
      // normalized check using implicit form aligned to 2D curve bounds
      const nx = x/16;
      const ny = y/17;
      const a = nx*nx + ny*ny - 1;
      return (a*a*a - nx*nx*ny*ny*ny) <= 0;
    }

    function heartVolumePoints(target, minDist){
      const pts=[];
      const scaleX = 0.108;
      const scaleY = 0.112; // emphasize vertical/lobe shape
      const center = new THREE.Vector3(0, 0.14, 0);
      let attempts=0, seed=0;
      while(pts.length < target && attempts < target*700){
        attempts++; seed++;
        // more points on the outline to make the heart silhouette and two lobes clearly visible
        const t = (seed * 0.6180339887 % 1) * Math.PI * 2;
        const r = Math.random();
        let s;
        if(r < 0.62) s = 0.955 + Math.random()*0.045;    // crisp outer shell (lobes/cleft)
        else if(r < 0.86) s = 0.72 + Math.random()*0.21;  // middle volume
        else s = 0.36 + Math.random()*0.30;               // inner fill
        const p2 = heartPoint2D(t);
        const x = p2.x * s;
        const y = p2.y * s;
        // reduce depth so 3D doesn't blur the heart shape
        const zMax = 3.6 * (0.18 + 0.82*(1 - Math.pow(s,1.25)));
        const z = (Math.random()*2 - 1) * zMax;
        const p = new THREE.Vector3(x*scaleX, y*scaleY + 0.14, z*0.075);
        // keep clear area around center phrase so it stands out
        if(p.distanceTo(center) < 0.62) continue;
        let ok=true;
        for(let i=0;i<pts.length;i++){
          if(p.distanceToSquared(pts[i]) < minDist*minDist){ ok=false; break; }
        }
        if(ok) pts.push(p);
      }
      return pts;
    }

    function makeTextSprite(text, opts={}){
      const fontSize = opts.fontSize || 26;
      const pad = opts.pad || 8;
      const fill = opts.fill || '#ff7ab8';
      const c=document.createElement('canvas'); const ctx=c.getContext('2d');
      ctx.font=`700 ${fontSize}px system-ui, -apple-system, Segoe UI, Noto Sans, sans-serif`;
      const w=Math.ceil(ctx.measureText(text).width)+pad*2;
      const h=fontSize+pad*2;
      c.width=w; c.height=h;
      const ctx2=c.getContext('2d');
      ctx2.font=`700 ${fontSize}px system-ui, -apple-system, Segoe UI, Noto Sans, sans-serif`;
      ctx2.textAlign='center'; ctx2.textBaseline='middle';
      ctx2.fillStyle=fill;
      ctx2.fillText(text,w/2,h/2);
      const tex=new THREE.CanvasTexture(c);
      tex.colorSpace=THREE.SRGBColorSpace;
      tex.minFilter=THREE.LinearFilter;
      tex.generateMipmaps=false;
      const mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, depthTest:true});
      mat.color = new THREE.Color(opts.color || '#ff5fae');
      const sprite=new THREE.Sprite(mat);
      const scale=opts.scale || 0.0035;
      sprite.scale.set(w*scale, h*scale, 1);
      sprite.userData.baseScale=sprite.scale.clone();
      return sprite;
    }

    function initHeart(){
      if(heartBuilt) return; heartBuilt=true;
      const container=document.getElementById('three');
      renderer=new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(W,H);
      renderer.setClearColor(0x000000,1);
      container.appendChild(renderer.domElement);

      scene=new THREE.Scene();
      camera=new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
      camera.position.set(0,0.05,7.6);

      controls=new OrbitControls(camera, renderer.domElement);
      controls.enableDamping=true; controls.dampingFactor=0.06;
      controls.enablePan=false;
      controls.minDistance=3.0; controls.maxDistance=14;
      controls.rotateSpeed=0.8; controls.zoomSpeed=0.9;
      // keep upright while allowing full spin
      controls.minPolarAngle = Math.PI*0.35;
      controls.maxPolarAngle = Math.PI*0.65;

      group=new THREE.Group();
      scene.add(group);

      const isMobile = Math.min(W,H) < 700;
      const COUNT = isMobile ? 300 : 420;
      const minDist = isMobile ? 0.33 : 0.31;
      const pts = heartVolumePoints(COUNT, minDist);
      for(let i=0;i<pts.length;i++){
        const phrase = PHRASES[i % PHRASES.length];
        const sprite = makeTextSprite(phrase);
        sprite.position.copy(pts[i]);
        sprite.userData.baseScale = sprite.scale.clone();
        group.add(sprite);
      }

      // center phrase - highlighted
      const center = makeTextSprite('Te Amo Fofi', {fontSize: 34, pad: 12, fill: '#ffffff', color: '#ff4fa8', scale: 0.0042});
      center.position.set(0, 0.12, 0);
      center.scale.multiplyScalar(1.25);
      center.userData.baseScale = center.scale.clone();
      center.userData.isCenter = true;
      group.add(center);

      scene.add(new THREE.AmbientLight(0xffffff,0.95));

      function adapt(){
        const d=camera.position.distanceTo(controls.target);
        const factor = THREE.MathUtils.clamp(1.08 - (d-6.5)*0.055, 0.6, 1.4);
        group.children.forEach(ch=>{ if(ch.isSprite && ch.userData.baseScale) ch.scale.copy(ch.userData.baseScale).multiplyScalar(factor); });
      }
      controls.addEventListener('change', adapt); adapt();

      heartStart = performance.now();
      animateHeart();
    }

    function animateHeart(now){
      requestAnimationFrame(animateHeart);
      if(!renderer || !group) return;
      // slower continuous full spin around Y axis (stays upright)
      group.rotation.y += 0.0025;
      controls.update();

      // white metallic light pass from top to bottom every 5s
      const t = ((now - heartStart) % 5000) / 5000;
      const top = 2.0, bot = -1.8;
      const bandY = top - t * (top - bot + 0.7);
      const bandHalf = 0.32;
      const base = new THREE.Color('#ff5fae');
      const hi = new THREE.Color('#ffffff');
      group.children.forEach(ch=>{
        if(!ch.isSprite) return;
        const isCenter = ch.userData.isCenter;
        const baseC = isCenter ? new THREE.Color('#ff4fa8') : base;
        const dist = Math.abs(ch.position.y - bandY);
        if(dist < bandHalf){
          const k = 1 - dist/bandHalf;
          const w = Math.pow(k, 1.7);
          ch.material.color.copy(baseC).lerp(hi, isCenter ? 0.95*w : 0.85*w);
        } else {
          ch.material.color.copy(baseC);
        }
      });

      renderer.render(scene,camera);
    }

    let transitionStart=0;
    function runSequence(){
      transitioning=false; particles=[];
      heartStage.classList.remove('show'); tulipStage.classList.remove('fade');
      hint.classList.remove('show'); repeatBtn.classList.remove('show');
      cancelAnimationFrame(animId);
      if(camera && controls){ camera.position.set(0,0.05,7.8); controls.target.set(0,0,0); controls.update(); }
      startTime=performance.now();
      const tulipDuration=4200, transDuration=1600;
      function frame(now){
        const elapsed=now-startTime;
        if(elapsed < tulipDuration){
          drawTulip(elapsed);
        } else if(!transitioning){
          transitioning=true; transitionStart=now; spawnParticlesFromTulip();
        }
        if(transitioning){
          const p=Math.min(1,(now-transitionStart)/transDuration);
          drawTransition(p);
          tulipStage.classList.add('fade');
          if(p>=1){
            heartStage.classList.add('show');
            initHeart();
            setTimeout(()=>hint.classList.add('show'), 400);
            setTimeout(()=>repeatBtn.classList.add('show'), 800);
            return;
          }
        }
        animId=requestAnimationFrame(frame);
      }
      animId=requestAnimationFrame(frame);
    }

    repeatBtn.addEventListener('click', runSequence);

    resizeAll();
    runSequence();
  </script>
</body>
</html>
