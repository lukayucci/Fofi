<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030a">
  <title>Fofi</title>
  <style>
    :root {
      --bg: #05030a;
      --pink: #ff4fd8;
      --pink-soft: #ff8ee8;
      --glow: 0 0 12px rgba(255,79,216,.7), 0 0 28px rgba(255,79,216,.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at bottom, #12061a 0%, var(--bg) 60%); color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas, #three, #heartCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #tulip-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity 1.2s ease; }
    #tulip-stage.fade { opacity: 0; pointer-events: none; }
    #heart-stage { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; background:#000; }
    #heart-stage.show { opacity: 1; pointer-events: auto; }
    #hint {
      position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      font-size: 13px; letter-spacing: .02em; color: rgba(255,255,255,.75); text-align: center;
      padding: 8px 14px; border-radius: 999px; background: rgba(20,10,28,.45); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,79,216,.25); box-shadow: 0 0 18px rgba(255,79,216,.12);
      opacity: 0; transition: opacity .8s ease; pointer-events: none; white-space: nowrap;
    }
    #hint.show { opacity: 1; }
    #repeat {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
      padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,79,216,.5);
      background: rgba(20,10,28,.55); color: #ffd9f6; font-size: 13px; font-weight: 600;
      box-shadow: var(--glow); backdrop-filter: blur(6px); opacity: 0; transform: translateY(-6px);
      transition: opacity .6s ease, transform .6s ease; pointer-events: none;
    }
    #repeat.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #repeat:active { transform: scale(.97); }
    .stars { position:absolute; inset:0; pointer-events:none; background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.35), transparent),
      radial-gradient(2px 2px at 85% 70%, rgba(255,142,232,.45), transparent),
      radial-gradient(1px 1px at 55% 55%, rgba(255,255,255,.3), transparent);
      opacity:.7; }
  </style>
</head>
<body>
  <div id="app">
    <div class="stars"></div>
    <div id="tulip-stage"><canvas id="tulip"></canvas></div>
    <div id="heart-stage"><canvas id="heartCanvas"></canvas></div>
    <button id="repeat" aria-label="Repetir">↺ Repetir</button>
    <div id="hint">Hecho con amor</div>
  </div>

    <script>
    const PHRASES = ["Te amo","I love you","Je t’aime","Ti amo","Eu te amo","Ich liebe dich","Ik hou van je","Jag älskar dig","Jeg elsker deg","Jeg elsker dig","Rakastan sinua","Ég elska þig","Kocham cię","Miluji tě","Ľúbim ťa","Szeretlek","Te iubesc","T’estimo","Quérote","Maite zaitut","Σ’ αγαπώ","Я тебя люблю","Я тебе кохаю","Обичам те","Волим те","Volim te","Ljubim te","Те сакам","Të dua","Myliu tave","Es tevi mīlu","Ma armastan sind","Seni seviyorum","أحبك","אני אוהב אותך","دوستت دارم","मैं तुमसे प्यार करता हूँ","আমি তোমাকে ভালোবাসি","میں تم سے محبت کرتا ہوں","ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","நான் உன்னை காதலிக்கிறேன்","నేను నిన్ను ప్రేమిస్తున్నాను","मी तुझ्यावर प्रेम करतो","હું તને પ્રેમ કરું છું","ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","我爱你","愛してる","사랑해","ฉันรักคุณ","Anh yêu em","Aku cinta kamu","Saya cintakan awak","Mahal kita","Aku tresna sampeyan","Nakupenda","Ngiyakuthanda","Ndiyakuthanda","Ek het jou lief","እወድሃለሁ","Ina son ki","Mo nifẹ rẹ","A hụrụ m gị n’anya","Waan ku jeclahay","Tiako ianao","Inħobbok","Tá grá agam duit","Tha gaol agam ort","Rwy’n dy garu di","Da garout a ran","Te amo","Mi amas vin","მიყვარხარ","Ես քեզ սիրում եմ","Mən səni sevirəm","Мен сені жақсы көремін","Men seni sevaman","Ман туро дӯст медорам","Мен сени сүйөм","Men seni söýýärin","Би чамд хайртай","म तिमीलाई माया गर्छु","මම ඔයාට ආදරෙයි","မင်းကိုချစ်တယ်","ខ្ញុំស្រឡាញ់អ្នក","ຂ້ອຍຮັກເຈົ້າ","زه تا سره مینه لرم","Ez te hez dikim","איך האָב דיך ליב","Ech hunn dech gär","Ik hâld fan dy","Volim te","Aroha ahau ki a koe","Aloha au iā ʻoe","Ou te alofa ia te oe","Ua here au ia oe","Kuyayki","Munsmawa","Rohayhu","Poyeyen"];

    const tulipCanvas = document.getElementById('tulip');
    const tctx = tulipCanvas.getContext('2d');
    const tulipStage = document.getElementById('tulip-stage');
    const heartStage = document.getElementById('heart-stage');
    const heartCanvas = document.getElementById('heartCanvas');
    const hctx = heartCanvas.getContext('2d');
    const hint = document.getElementById('hint');
    const repeatBtn = document.getElementById('repeat');

    let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
    let startTime=0, animId, particles=[], transitioning=false;
    let heartAnimId=null, heartStart=0, heartRows=[], heartMeta=null;
    let viewScale=1, viewRot=0;

    const pointers = new Map();
    let lastPinchDist=null, lastPinchAngle=null, lastDrag=null;

    function resizeAll(){
      W = window.innerWidth; H = window.innerHeight; dpr = Math.min(window.devicePixelRatio||1,2);
      tulipCanvas.width = Math.floor(W*dpr); tulipCanvas.height = Math.floor(H*dpr);
      tctx.setTransform(dpr,0,0,dpr,0,0);
      heartCanvas.width = Math.floor(W*dpr); heartCanvas.height = Math.floor(H*dpr);
      hctx.setTransform(dpr,0,0,dpr,0,0);
      heartRows=[]; heartMeta=null;
    }
    window.addEventListener('resize', resizeAll, {passive:true});

    function drawTulip(t){
      tctx.clearRect(0,0,W,H);
      const cx=W/2, baseY=H*0.78, sway=Math.sin(t*0.0012)*6;
      const scale=Math.min(W,H)/520;
      tctx.save();
      tctx.translate(cx, baseY);
      tctx.rotate(sway*Math.PI/180*0.6);
      const stemH=220*scale;
      const gradStem=tctx.createLinearGradient(0,0,0,-stemH);
      gradStem.addColorStop(0,'#1f7a4a'); gradStem.addColorStop(1,'#46d17f');
      tctx.strokeStyle=gradStem; tctx.lineWidth=10*scale; tctx.lineCap='round';
      tctx.beginPath();
      tctx.moveTo(0,0);
      tctx.quadraticCurveTo(18*scale,-stemH*0.45,-6*scale,-stemH);
      tctx.stroke();
      function leaf(side){
        tctx.save(); tctx.translate(0,-stemH*0.35); tctx.scale(side,1);
        const g=tctx.createLinearGradient(0,0,120*scale,-40*scale);
        g.addColorStop(0,'#2aa35f'); g.addColorStop(1,'#7dffb2');
        tctx.fillStyle=g; tctx.shadowColor='rgba(80,255,160,.25)'; tctx.shadowBlur=18*scale;
        tctx.beginPath();
        tctx.moveTo(0,0);
        tctx.quadraticCurveTo(70*scale,-10*scale,120*scale,-70*scale);
        tctx.quadraticCurveTo(55*scale,-20*scale,0,10*scale);
        tctx.fill(); tctx.restore();
      }
      leaf(1); leaf(-0.9);
      const py=-stemH, bloom=1+Math.sin(t*0.002)*0.03;
      tctx.translate(0,py);
      tctx.scale(bloom,bloom);
      const petal=(ang,rx,ry,rot,color1,color2)=>{
        tctx.save(); tctx.rotate(ang+rot);
        const g=tctx.createRadialGradient(0,-ry*0.2,ry*0.1,0,0,ry);
        g.addColorStop(0,color1); g.addColorStop(1,color2);
        tctx.fillStyle=g; tctx.shadowColor='rgba(255,90,150,.35)'; tctx.shadowBlur=22*scale;
        tctx.beginPath();
        tctx.moveTo(0,0);
        tctx.bezierCurveTo(rx, -ry*0.2, rx*0.9, -ry, 0, -ry*1.15);
        tctx.bezierCurveTo(-rx*0.9, -ry, -rx, -ry*0.2, 0, 0);
        tctx.fill(); tctx.restore();
      };
      const r1='#ff6fae', r2='#d81b60', r3='#ff9ecb', r4='#ff4f8b';
      petal(0,55*scale,95*scale,0,r3,r2);
      petal(-0.55,50*scale,90*scale,0,r1,r2);
      petal(0.55,50*scale,90*scale,0,r1,r2);
      petal(-0.2,42*scale,80*scale,0,r4,r2);
      petal(0.2,42*scale,80*scale,0,r4,r2);
      const glow=tctx.createRadialGradient(0,-40*scale,5*scale,0,-40*scale,60*scale);
      glow.addColorStop(0,'rgba(255,220,240,.7)'); glow.addColorStop(1,'rgba(255,120,180,0)');
      tctx.fillStyle=glow; tctx.beginPath(); tctx.arc(0,-40*scale,55*scale,0,Math.PI*2); tctx.fill();
      tctx.restore();
      const gg=tctx.createRadialGradient(cx,H*0.82,10*scale,cx,H*0.82,140*scale);
      gg.addColorStop(0,'rgba(255,79,216,.18)'); gg.addColorStop(1,'rgba(255,79,216,0)');
      tctx.fillStyle=gg; tctx.beginPath(); tctx.ellipse(cx,H*0.83,140*scale,30*scale,0,0,Math.PI*2); tctx.fill();
    }

    function spawnParticlesFromTulip(){
      const cx=W/2, cy=H*0.45;
      particles=[];
      const count = Math.min(260, Math.floor((W*H)/5000));
      for(let i=0;i<count;i++){
        const ang=Math.random()*Math.PI*2, rad=Math.random()*Math.min(W,H)*0.18;
        particles.push({
          x: cx + Math.cos(ang)*rad + (Math.random()-0.5)*40,
          y: cy + Math.sin(ang)*rad*0.9 + (Math.random()-0.5)*40,
          vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.8)*1.2,
          tx:0, ty:0, s:1+Math.random()*2.2, hue: 300 + Math.random()*30
        });
      }
      for(let i=0;i<particles.length;i++){
        const tt=i/particles.length*Math.PI*2;
        const x=16*Math.pow(Math.sin(tt),3);
        const y=13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt);
        particles[i].tx = cx + x * Math.min(W,H)*0.018;
        particles[i].ty = cy + 10 - y * Math.min(W,H)*0.018;
      }
    }

    function drawTransition(p){
      tctx.clearRect(0,0,W,H);
      for(const pt of particles){
        pt.x += (pt.tx-pt.x)*0.06 + pt.vx*0.2;
        pt.y += (pt.ty-pt.y)*0.06 + pt.vy*0.2;
        tctx.beginPath();
        tctx.fillStyle=`hsla(${pt.hue},100%,70%,${0.25 + p*0.55})`;
        tctx.shadowColor=`hsla(${pt.hue},100%,65%,.9)`; tctx.shadowBlur=12;
        tctx.arc(pt.x,pt.y,pt.s,0,Math.PI*2); tctx.fill();
      }
      tctx.shadowBlur=0;
    }

    function insideHeart2(nx, ny){
      const a = nx*nx + ny*ny - 1;
      return (a*a*a - nx*nx*ny*ny*ny) <= 0;
    }

    function heartXRangeAtY(ny, scale){
      let minX=null, maxX=null;
      const maxR = scale*1.35;
      const step = 2;
      for(let px = Math.floor(-maxR); px <= Math.ceil(maxR); px+=step){
        const nx = px/scale;
        if(insideHeart2(nx, ny)){
          if(minX===null) minX=px;
          maxX=px;
        }
      }
      if(minX!==null){ while(minX>-maxR && insideHeart2((minX-1)/scale, ny)) minX--; }
      if(maxX!==null){ while(maxX<maxR && insideHeart2((maxX+1)/scale, ny)) maxX++; }
      return (minX!==null && maxX-minX>12) ? [minX,maxX] : null;
    }

    function buildHeartRows(){
      heartRows=[];
      const scale = Math.min(W, H) * 0.33; // smaller so full shape visible
      const fontSize = Math.max(9, Math.min(12, W*0.028));
      const lineH = fontSize * 1.12;
      hctx.setTransform(dpr,0,0,dpr,0,0);
      hctx.font = `700 ${fontSize}px system-ui, -apple-system, Segoe UI, Noto Sans, sans-serif`;
      hctx.textBaseline='middle';
      const spaceW = hctx.measureText(' ').width;
      const top = - scale*1.15;
      const bottom = scale*1.02;
      let phraseIndex = 0;
      for(let y = top; y <= bottom; y += lineH){
        const ny = - y / scale;
        const range = heartXRangeAtY(ny, scale);
        if(!range) continue;
        let [x1,x2] = range;
        x1 += 1; x2 -= 1;
        const width = x2 - x1;
        if(width < 20) continue;
        let words=[], idx=phraseIndex, totalW=0, guard=0;
        while(totalW < width + 20 && guard < 120){
          const w = PHRASES[idx % PHRASES.length];
          const ww = hctx.measureText(w).width;
          words.push(w);
          totalW += (words.length>1?spaceW*0.4:0) + ww;
          idx++; guard++;
        }
        phraseIndex = (phraseIndex + 2) % PHRASES.length;
        heartRows.push({x1,x2,y,width,words,lineH,fontSize});
      }
      heartMeta = {scale,fontSize,lineH};
    }

    function drawJustifiedLine(words, x, y, width){
      if(words.length===0) return;
      if(words.length===1){ hctx.fillText(words[0], x, y); return; }
      const widths = words.map(w=>hctx.measureText(w).width);
      const totalWords = widths.reduce((a,b)=>a+b,0);
      const gaps = words.length-1;
      let gap = (width - totalWords) / gaps;
      if(gap < 0.5) gap = 0.5;
      let cxp = x;
      for(let i=0;i<words.length;i++){
        hctx.fillText(words[i], cxp, y);
        cxp += widths[i] + gap;
      }
    }

    function drawHeartText(ts){
      if(!heartStart) heartStart=ts;
      const elapsed = ts - heartStart;
      hctx.setTransform(dpr,0,0,dpr,0,0);
      hctx.clearRect(0,0,W,H);
      hctx.fillStyle='#000';
      hctx.fillRect(0,0,W,H);

      if(heartRows.length===0) buildHeartRows();
      if(heartRows.length===0 || !heartMeta){ heartAnimId=requestAnimationFrame(drawHeartText); return; }
      const {scale} = heartMeta;

      // apply user transform (rotate/zoom)
      hctx.save();
      hctx.translate(W/2, H*0.5);
      hctx.rotate(viewRot);
      hctx.scale(viewScale, viewScale);

      const baseGrad = hctx.createLinearGradient(0, -scale*1.2, 0, scale*1.1);
      baseGrad.addColorStop(0.00,'#e5e5e5');
      baseGrad.addColorStop(0.15,'#ff8fce');
      baseGrad.addColorStop(0.30,'#f8f8f8');
      baseGrad.addColorStop(0.45,'#ff4fb3');
      baseGrad.addColorStop(0.60,'#ededed');
      baseGrad.addColorStop(0.75,'#ff7fc8');
      baseGrad.addColorStop(0.90,'#ffffff');
      baseGrad.addColorStop(1.00,'#d8d8d8');

      // white metallic light pass from top to bottom every 5 seconds
      const cycle = 5000;
      const t = (elapsed % cycle) / cycle;
      const topY = -scale*1.3;
      const botY = scale*1.15;
      const bandCenter = topY + t * (botY - topY + 120) - 60;
      const bandH = scale * 0.35;
      const shineGrad = hctx.createLinearGradient(0, bandCenter - bandH, 0, bandCenter + bandH);
      shineGrad.addColorStop(0.0,'rgba(255,255,255,0)');
      shineGrad.addColorStop(0.35,'rgba(255,255,255,0)');
      shineGrad.addColorStop(0.5,'rgba(255,255,255,0.98)');
      shineGrad.addColorStop(0.65,'rgba(255,255,255,0)');
      shineGrad.addColorStop(1.0,'rgba(255,255,255,0)');

      for(const row of heartRows){
        hctx.font = `700 ${row.fontSize}px system-ui, -apple-system, Segoe UI, Noto Sans, sans-serif`;
        hctx.textBaseline='middle';
        hctx.save();
        hctx.beginPath();
        hctx.rect(row.x1, row.y-row.lineH/2, row.width, row.lineH);
        hctx.clip();
        hctx.fillStyle = baseGrad;
        drawJustifiedLine(row.words, row.x1, row.y, row.width);
        hctx.globalCompositeOperation = 'screen';
        hctx.fillStyle = shineGrad;
        drawJustifiedLine(row.words, row.x1, row.y, row.width);
        hctx.globalCompositeOperation = 'source-over';
        hctx.restore();
      }

      hctx.restore();
      heartAnimId = requestAnimationFrame(drawHeartText);
    }

    function startHeart(){
      if(heartAnimId) cancelAnimationFrame(heartAnimId);
      heartStart=0; heartRows=[]; heartMeta=null;
      viewScale=1; viewRot=0;
      heartAnimId = requestAnimationFrame(drawHeartText);
    }

    // interaction: rotate and zoom
    function getPinchInfo(){
      const pts = [...pointers.values()];
      const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      return { dist: Math.hypot(dx,dy), angle: Math.atan2(dy,dx) };
    }
    heartCanvas.addEventListener('pointerdown', (e)=>{
      heartCanvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pointers.size===1){ lastDrag = {x:e.clientX, y:e.clientY}; }
      if(pointers.size===2){ const info=getPinchInfo(); lastPinchDist=info.dist; lastPinchAngle=info.angle; }
    });
    heartCanvas.addEventListener('pointermove', (e)=>{
      if(!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pointers.size===1 && lastDrag){
        const dx = e.clientX - lastDrag.x;
        viewRot += dx * 0.008;
        lastDrag = {x:e.clientX, y:e.clientY};
      } else if(pointers.size===2){
        const info=getPinchInfo();
        if(lastPinchDist){ viewScale *= info.dist/lastPinchDist; viewScale = Math.max(0.4, Math.min(6, viewScale)); }
        if(lastPinchAngle!=null){ viewRot += (info.angle - lastPinchAngle); }
        lastPinchDist=info.dist; lastPinchAngle=info.angle;
      }
    });
    function endPointer(e){
      pointers.delete(e.pointerId);
      if(pointers.size<2){ lastPinchDist=null; lastPinchAngle=null; }
      if(pointers.size===1){ const p=[...pointers.values()][0]; lastDrag={x:p.x,y:p.y}; }
      if(pointers.size===0){ lastDrag=null; }
    }
    heartCanvas.addEventListener('pointerup', endPointer);
    heartCanvas.addEventListener('pointercancel', endPointer);
    heartCanvas.addEventListener('wheel', (e)=>{
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      viewScale = Math.max(0.4, Math.min(6, viewScale*factor));
    }, {passive:false});

    let transitionStart=0;
    function runSequence(){
      transitioning=false; particles=[];
      heartStage.classList.remove('show'); tulipStage.classList.remove('fade');
      hint.classList.remove('show'); repeatBtn.classList.remove('show');
      if(heartAnimId){ cancelAnimationFrame(heartAnimId); heartAnimId=null; }
      cancelAnimationFrame(animId);
      startTime=performance.now();
      const tulipDuration=4200, transDuration=1600;
      function frame(now){
        const elapsed=now-startTime;
        if(elapsed < tulipDuration){
          drawTulip(elapsed);
        } else if(!transitioning){
          transitioning=true; transitionStart=now; spawnParticlesFromTulip();
        }
        if(transitioning){
          const p=Math.min(1,(now-transitionStart)/transDuration);
          drawTransition(p);
          tulipStage.classList.add('fade');
          if(p>=1){
            heartStage.classList.add('show');
            startHeart();
            setTimeout(()=>hint.classList.add('show'), 400);
            setTimeout(()=>repeatBtn.classList.add('show'), 800);
            return;
          }
        }
        animId=requestAnimationFrame(frame);
      }
      animId=requestAnimationFrame(frame);
    }

    repeatBtn.addEventListener('click', runSequence);
    hint.textContent = 'Girá y hacé zoom';

    resizeAll();
    runSequence();
  </script>
</body>
</html>
